<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--color-text-primary, #222);
    background: transparent;
  }
  .adb { padding: 4px 2px 8px; min-width: 360px; }

  .adb-status-card {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; border-radius: 8px;
    border: 1px solid var(--color-border, #ddd);
    background: var(--color-surface-muted, #f5f5f5);
    color: var(--color-text-secondary, #666);
  }
  .adb-status-card.connected {
    border-color: #22c55e; background: rgba(34,197,94,0.08);
    color: var(--color-text-primary, #222);
  }
  .adb-dot { width: 12px; height: 12px; border-radius: 50%; background: #9ca3af; flex: 0 0 auto; }
  .adb-status-card.connected .adb-dot { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,0.18); }
  .adb-status-title { font-weight: 600; font-size: 1rem; margin-bottom: 3px; color: var(--color-text-primary, #222); }
  .adb-status-sub { font-size: 0.82rem; line-height: 1.35; color: var(--color-text-secondary, #666); }

  .adb-details { margin-top: 14px; border: 1px solid var(--color-border, #ddd); border-radius: 8px; overflow: hidden; }
  .adb-row { display: flex; justify-content: space-between; padding: 9px 14px; font-size: 0.88rem; }
  .adb-row:not(:last-child) { border-bottom: 1px solid var(--color-border, #eee); }
  .adb-key { color: var(--color-text-secondary, #666); }
  .adb-val { font-variant-numeric: tabular-nums; color: var(--color-text-primary, #222); font-weight: 500; }

  .adb-controls { margin-top: 16px; }
  .adb-jog { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .adb-actionrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .adb-ctl {
    padding: 10px 8px; border-radius: 6px; border: 1px solid var(--color-border, #ddd);
    background: var(--color-surface, #fff); color: var(--color-text-primary, #222);
    font-size: 0.88rem; font-weight: 500; cursor: pointer; user-select: none;
  }
  .adb-ctl:hover:not(:disabled) { background: var(--color-surface-muted, #f0f0f0); }
  .adb-ctl:active:not(:disabled) { background: var(--color-accent, #4a90e2); color: #fff; border-color: var(--color-accent, #4a90e2); }
  .adb-ctl:disabled { opacity: 0.45; cursor: not-allowed; }
  .adb-ctl.jog { padding: 14px 8px; font-size: 0.95rem; }
  .adb-hint { font-size: 0.72rem; color: var(--color-text-secondary, #888); font-weight: 400; }
</style>
</head>
<body>
<div class="adb">
  <div id="statusCard" class="adb-status-card">
    <span class="adb-dot"></span>
    <div>
      <div id="statusTitle" class="adb-status-title">Checking…</div>
      <div id="statusSub" class="adb-status-sub">Contacting the AutoDustBoot through the dongle…</div>
    </div>
  </div>

  <div id="details" class="adb-details" style="display:none">
    <div class="adb-row"><span class="adb-key">State</span><span class="adb-val" id="vState">—</span></div>
    <div class="adb-row"><span class="adb-key">Position</span><span class="adb-val" id="vPos">—</span></div>
    <div class="adb-row"><span class="adb-key">Saved</span><span class="adb-val" id="vSaved">—</span></div>
    <div class="adb-row"><span class="adb-key">Homed</span><span class="adb-val" id="vHomed">—</span></div>
  </div>

  <div class="adb-controls">
    <div class="adb-jog">
      <button type="button" class="adb-ctl jog" data-jog="up">▲ Up <span class="adb-hint">(hold)</span></button>
      <button type="button" class="adb-ctl jog" data-jog="down">▼ Down <span class="adb-hint">(hold)</span></button>
    </div>
    <div class="adb-actionrow">
      <button type="button" class="adb-ctl" data-send="goto:0">Retract</button>
      <button type="button" class="adb-ctl" id="btnExpand" data-expand>Expand</button>
      <button type="button" class="adb-ctl" data-send="home">Home</button>
      <button type="button" class="adb-ctl" data-send="save" title="Save current position as the Expand target">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  var DEVICE = 'autodustboot';

  function apiBase() {
    if (window.ncSender && typeof window.ncSender.getApiBaseUrl === 'function') {
      try { return window.ncSender.getApiBaseUrl(); } catch (e) {}
    }
    var port = '__SERVER_PORT__';
    return window.location.protocol + '//' + window.location.hostname + ':' + port;
  }
  var BASE = apiBase();

  var state = { connected: false, pos: null, saved: null, state: null, homed: null, lastSeenMs: -1 };

  // Payload looks like: "status pos=123 saved=0 state=home homed=1" (tolerant token parse)
  function parsePayload(payload) {
    if (!payload) return;
    payload.split(/\s+/).forEach(function (tok) {
      var eq = tok.indexOf('=');
      if (eq <= 0) return;
      var k = tok.slice(0, eq), v = tok.slice(eq + 1);
      if (k === 'pos') state.pos = parseInt(v, 10);
      else if (k === 'saved') state.saved = parseInt(v, 10);
      else if (k === 'state') state.state = v;
      else if (k === 'homed') state.homed = (v === '1' || v.toLowerCase() === 'true');
    });
  }

  function render() {
    var card = document.getElementById('statusCard');
    var title = document.getElementById('statusTitle');
    var sub = document.getElementById('statusSub');
    var details = document.getElementById('details');

    card.classList.toggle('connected', !!state.connected);
    if (state.connected) {
      title.textContent = 'Paired & Connected';
      sub.textContent = 'Linked through the dongle' + (state.lastSeenMs >= 0 ? ' · last seen ' + state.lastSeenMs + ' ms ago' : '');
      details.style.display = '';
      document.getElementById('vState').textContent = state.state == null ? '—' : state.state;
      document.getElementById('vPos').textContent = state.pos == null ? '—' : state.pos;
      document.getElementById('vSaved').textContent = state.saved == null ? '—' : state.saved;
      document.getElementById('vHomed').textContent = state.homed == null ? '—' : (state.homed ? 'Yes' : 'No');
    } else {
      title.textContent = 'Not detected';
      sub.textContent = 'Not receiving data. Power on the AutoDustBoot and, if it was never paired, open the dongle pairing window ($PAIR) so it can bind.';
      details.style.display = 'none';
    }

    document.querySelectorAll('.adb-ctl').forEach(function (b) { b.disabled = !state.connected; });
    var expand = document.getElementById('btnExpand');
    expand.textContent = state.saved != null ? 'Expand' : 'Expand';
  }

  function send(payload) {
    fetch(BASE + '/api/dongle/devices/' + DEVICE + '/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ payload: payload })
    }).catch(function () { /* dongle may be absent */ });
  }

  // Wire buttons
  document.querySelectorAll('[data-send]').forEach(function (b) {
    b.addEventListener('click', function () { send(b.getAttribute('data-send')); });
  });
  document.getElementById('btnExpand').addEventListener('click', function () {
    send('goto:' + (state.saved != null ? state.saved : 0));
  });

  // Long-press jog: repeat faster than the firmware keepalive, then "stop" on release.
  var jogTimer = null;
  function startJog(dir) { send(dir); if (jogTimer) clearInterval(jogTimer); jogTimer = setInterval(function () { send(dir); }, 300); }
  function stopJog() { if (!jogTimer) return; clearInterval(jogTimer); jogTimer = null; send('stop'); }
  document.querySelectorAll('[data-jog]').forEach(function (b) {
    var dir = b.getAttribute('data-jog');
    b.addEventListener('mousedown', function () { startJog(dir); });
    b.addEventListener('mouseup', stopJog);
    b.addEventListener('mouseleave', stopJog);
    b.addEventListener('touchstart', function (e) { e.preventDefault(); startJog(dir); }, { passive: false });
    b.addEventListener('touchend', function (e) { e.preventDefault(); stopJog(); }, { passive: false });
  });

  // Initial snapshot
  fetch(BASE + '/api/dongle/devices/' + DEVICE)
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) { render(); return; }
      state.connected = !!d.connected;
      state.lastSeenMs = typeof d.lastSeenMs === 'number' ? d.lastSeenMs : -1;
      parsePayload(d.lastMessage);
      render();
    })
    .catch(function () { render(); });

  // Live updates via the generic dongle WS bridge (additive; may be absent on older apps).
  var offMsg = null, offChg = null, pollTimer = null;
  if (window.ncSender && typeof window.ncSender.onServerEvent === 'function') {
    offMsg = window.ncSender.onServerEvent('dongle:device-message', function (m) {
      if (!m || m.name !== DEVICE) return;
      state.connected = true;
      state.lastSeenMs = 0;
      parsePayload(m.payload);
      render();
    });
    offChg = window.ncSender.onServerEvent('dongle:device-changed', function (c) {
      if (!c || c.name !== DEVICE) return;
      state.connected = !!c.connected;
      render();
    });
  } else {
    // Fallback: poll the REST snapshot for apps without the WS-for-plugins bridge.
    pollTimer = setInterval(function () {
      fetch(BASE + '/api/dongle/devices/' + DEVICE)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) return;
          state.connected = !!d.connected;
          state.lastSeenMs = typeof d.lastSeenMs === 'number' ? d.lastSeenMs : -1;
          parsePayload(d.lastMessage);
          render();
        }).catch(function () {});
    }, 1000);
  }

  window.addEventListener('unload', function () {
    stopJog();
    if (offMsg) offMsg();
    if (offChg) offChg();
    if (pollTimer) clearInterval(pollTimer);
  });
})();
</script>
</body>
</html>
